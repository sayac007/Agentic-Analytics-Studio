name: Contract validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/agentic-attention-matplotlib
      XDG_CACHE_HOME: /tmp/agentic-attention-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned runtime
        run: python3 -m pip install -r requirements-regimes.lock
      - name: Validate example manifest and CSV
        run: python3 contracts/validate.py
      - name: Validate separate generator contract
        run: python3 contracts/validate.py contracts/examples/generator.json --kind generator
      - name: Run contract and numerical tests
        run: python3 -m unittest discover -s tests -v
      - name: Parse Azure Cloud Shell deployment script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/deploy/azure/Deploy-Studio.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Check Azure deployment logic with local Az test doubles
        shell: pwsh
        run: ./tests/test_azure_deploy.ps1
      - name: Check actual Azure VM serialization and network tag models
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Az.Accounts -RequiredVersion 5.5.3 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
          Install-Module Az.Compute -RequiredVersion 11.10.0 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
          Install-Module Az.Network -RequiredVersion 8.3.0 -Scope CurrentUser -Repository PSGallery -Force -ErrorAction Stop
          ./tests/test_azure_vm_config.ps1
      - name: Check Azure bootstrap shell syntax
        run: bash -n deploy/azure/bootstrap.sh
      - name: Deterministic Stage A end-to-end smoke test
        run: python3 -m studio run --output artifacts/ci-smoke
      - name: Verify smoke artifacts and predictions
        run: python3 -m studio verify artifacts/ci-smoke
      - name: Offline KBA normalized-data audit
        run: python3 -m kba audit
      - name: Offline KBA parser fixture smoke test
        run: python3 -m kba extract --catalog tests/fixtures/kba/sources.json --raw-dir tests/fixtures/kba --output artifacts/kba-fixture-smoke
      - name: Re-extract and verify KBA smoke artifacts
        run: python3 -m kba verify --catalog tests/fixtures/kba/sources.json --raw-dir tests/fixtures/kba --output artifacts/kba-fixture-smoke
      - name: Offline Tesla campaign evidence artifact check
        run: python3 -m campaigns.transform --check
      - name: Offline organic-attention feasibility artifact check
        run: python3 -m attention.transform --check
      - name: Offline real-attention blocked-coverage check
        run: python3 -m attention.import_trends --check-blocked
      - name: Synthetic-only attention diagnostics smoke
        run: |
          python3 tests/fixtures/econometrics/generate.py --output "$RUNNER_TEMP/attention-fixture"
          python3 -m attention.econometrics --fixture \
            --raw tests/fixtures/trends/SYNTHETIC_extended.csv \
            --metadata tests/fixtures/trends/SYNTHETIC_extended_metadata.json \
            --import-dir "$RUNNER_TEMP/attention-fixture/import" \
            --admission "$RUNNER_TEMP/attention-fixture/SYNTHETIC_admission.json" \
            --kba "$RUNNER_TEMP/attention-fixture/SYNTHETIC_kba.csv" \
            --output-dir "$RUNNER_TEMP/attention-diagnostics"
      - name: Offline product and recall evidence check
        run: python3 -m product_events.transform --check
      - name: Offline macro blocked-source and normalization smoke
        run: |
          python3 -m macro_controls.pipeline --check
          python3 -m macro_controls.pipeline --fixture \
            --catalog tests/fixtures/macro/sources.json --series cpi \
            --raw tests/fixtures/macro/cpi.csv \
            --provenance tests/fixtures/macro/cpi.provenance.json \
            --derive cpi-yoy --output "$RUNNER_TEMP/SYNTHETIC-macro-cpi.json"
      - name: Offline fuel oil FX blocked-acquisition check
        run: python3 -m fuel_oil.fetch_fuel_oil --check
      - name: Offline real energy metadata-only check
        run: python3 -m fuel_oil.import_energy --check-metadata
      - name: Offline source-specific energy rights check
        run: python3 -m fuel_oil.rights_admission --check
      - name: Synthetic-only scoped private energy study smoke
        run: |
          python3 tests/fixtures/scoped_energy/generate.py --output "$RUNNER_TEMP/scoped-energy-fixture"
          python3 -m fuel_oil.scoped_study --fixture \
            --energy-dir "$RUNNER_TEMP/scoped-energy-fixture/energy" \
            --permits-dir "$RUNNER_TEMP/scoped-energy-fixture/permits" \
            --kba "$RUNNER_TEMP/scoped-energy-fixture/SYNTHETIC_kba.csv" \
            --output "$RUNNER_TEMP/scoped-energy-study"

      - name: Gate complete synthetic-only result export
        run: python3 -m studio.export artifacts/ci-smoke
      - name: Export synthetic Stage-A results for review
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-stage-a-${{ github.sha }}
          path: artifacts/ci-smoke/
          if-no-files-found: error
          retention-days: 7
