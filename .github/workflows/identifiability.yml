name: Synthetic identifiability research
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/task02-matplotlib
      XDG_CACHE_HOME: /tmp/task02-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-attention.lock
      - name: Numerical reference, isolation and failure checks
        run: python -m unittest discover -s tests -p test_identifiability.py -v
      - name: Fixed full 1000-seed synthetic grid
        run: python -m research_benchmark.run --output artifacts/research-task02
      - name: Verify complete data manifest and grid
        run: python -m research_benchmark.verify artifacts/research-task02
      - name: Render results-first report from verified outputs (no refit)
        run: python scripts/render_portfolio.py --source artifacts/research-task02 --output artifacts/portfolio-preview --readme artifacts/portfolio-README.md
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-identifiability-${{ github.sha }}
          path: artifacts/research-task02/
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-portfolio-${{ github.sha }}
          path: artifacts/portfolio-preview/
          if-no-files-found: error
          retention-days: 30
